                        id(battery_status_valid) = true;
                        return true;
                      });
              on_error:
                then:
                  - lambda: id(battery_status_valid) = false;

# ---------------------------------------------------------------------------
# Display: identical hardware/pin config to the main solar-battery-guard
# board (same LCDWIKI ESP32-32E/E32R28T) - reset_pin GPIO4, color_palette
# 8BIT, and swap_xy transform are all required for this exact board's
# ILI9341 panel to initialize correctly. See that project's README for
# the full pin-mapping background if this ever needs to move to different
# hardware.
# ---------------------------------------------------------------------------
spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

# ---------------------------------------------------------------------------
# Touch: wired but never actually used/calibrated on this hardware before
# now (see main solar-battery-guard.yaml's README - resistive touch was
# left as a documented follow-up). Pins are per this board's confirmed
# pin table (SCK/DIN/DOUT/CS/IRQ = 25/32/39/33/36) - separate bus from the
# display's own SPI, not shared.
#
# Since the goal is just "any tap toggles the mode" rather than precise
# on-screen button targeting, this deliberately skips per-unit position
# calibration (full 0-4095 raw ADC range) and only cares THAT a touch was
# detected, not where. If touches aren't registering reliably with these
# generous defaults, that's the first thing to revisit.
# ---------------------------------------------------------------------------
touchscreen:
  - platform: xpt2046
    id: touch_screen
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    calibration:
      x_min: 0
      x_max: 4095
      y_min: 0
      y_max: 4095
    on_touch:
      - lambda: |-
          // Single tap toggles display mode; double tap toggles the
          // backlight directly (no Home Assistant round-trip). A lone tap
          // can't be acted on immediately since we don't yet know whether
          // a second tap is coming - so it's scheduled after a short
          // "wait and see" delay, and touch_seq lets that delayed callback
          // notice a second tap arrived in the meantime and stand down.
          static uint32_t last_touch_ms = 0;
          static uint32_t bounce_guard_ms = 0;
          const uint32_t bounce_window = 150;    // ignore contact-bounce retriggers
          const uint32_t double_tap_window = 350; // max gap counted as a double tap

          uint32_t now = millis();
          if (now - bounce_guard_ms < bounce_window) return;
          bounce_guard_ms = now;

          bool is_double_tap = last_touch_ms != 0 && (now - last_touch_ms) < double_tap_window;

          if (is_double_tap) {
            last_touch_ms = 0;
            id(back_light).toggle().perform();
          } else {
            last_touch_ms = now;
            uint32_t seq = ++id(touch_seq);
            App.scheduler.set_timeout(id(touch_screen), "single_tap", double_tap_window, [seq]() {
              if (seq == id(touch_seq)) {
                std::string next_mode = id(display_mode).state == "Classic" ? "App Style" : "Classic";
                id(display_mode).make_call().set_option(next_mode).perform();
              }
            });
          }

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

color:
  - id: col_white
    hex: "FFFFFF"
  - id: col_black
    hex: "000000"
  - id: col_green
    hex: "2ECC71"
  - id: col_red
    hex: "E74C3C"
  - id: col_yellow
    hex: "F1C40F"
  - id: col_grey
    hex: "888888"
  - id: col_teal
    hex: "3FCFA8"
  - id: col_dark_teal
    hex: "1B4B44"

font:
  - file: "gfonts://Roboto"
    id: font_huge
    size: 56
  - file: "gfonts://Roboto"
    id: font_medium
    size: 24
  - file: "gfonts://Roboto@700"
    id: font_small_bold
    size: 18
  - file: "gfonts://Roboto"
    id: font_tiny
    size: 13
  - file: "gfonts://Roboto"
    id: font_small
    size: 16

display:
  - platform: ili9xxx
    model: ILI9341
    spi_id: tft_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4
    color_palette: 8BIT
    dimensions:
      width: 320
      height: 240
    transform:
      swap_xy: true
    invert_colors: false
    update_interval: 1s
    lambda: |-
      // App Style rotates the panel to portrait to better match the
      // phone-app layout it mimics. This board's base orientation is
      // already achieved via the static `transform: swap_xy` above (see
      // README for why this exact board needs that) - stacking a runtime
      // rotation on top of that is untested on this hardware and may need
      // a different ROTATION value than 90 (try 270 if this comes out
      // upside-down/mirrored rather than portrait-right-side-up).
      bool app_style = id(display_mode).state == "App Style";
      it.set_rotation(app_style ? display::DISPLAY_ROTATION_90_DEGREES : display::DISPLAY_ROTATION_0_DEGREES);

      it.fill(id(col_black));

      // Header
      it.print(10, 6, id(font_small_bold), id(col_grey), "SOLAR BATTERY MONITOR");

      // Status line: current date/time (synced from Home Assistant)
      auto now = id(ha_time).now();
      char status_buf[24];
      if (now.is_valid()) {
        snprintf(status_buf, sizeof(status_buf), "%04d-%02d-%02d %02d:%02d:%02d",
                  now.year, now.month, now.day_of_month,
                  now.hour, now.minute, now.second);
      } else {
        snprintf(status_buf, sizeof(status_buf), "----:--:-- --:--:--");
      }
      if (app_style) {
        it.print(it.get_width() / 2, 6 + 18 + 6, id(font_tiny), id(col_grey),
                  TextAlign::TOP_CENTER, status_buf);
      } else {
        it.print(it.get_width() - 10, 6 + 18 + 6, id(font_tiny), id(col_grey),
                  TextAlign::TOP_RIGHT, status_buf);
      }

      // Pick which data source feeds the display, based on the "Data
      // Source" select - normalizes both mechanisms to the same set of
      // local variables so the drawing code below doesn't need to care
      // which one is active.
      bool use_push = id(data_source_mode).state == "Push Subscription";
      const char* source_label = use_push ? "PUSH" : "HTTP";

      // Last update: when data was last actually received successfully -
      // a stuck timestamp here means the active source has stopped
      // delivering data. Labeled with which source is currently active.
      char last_update_buf[32];
      if (id(last_update_hour) >= 0) {
        snprintf(last_update_buf, sizeof(last_update_buf), "Updated %02d:%02d:%02d (%s)",
                  id(last_update_hour), id(last_update_minute), id(last_update_second),
                  source_label);
      } else {
        snprintf(last_update_buf, sizeof(last_update_buf), "Updated: never (%s)", source_label);
      }
      // Stacked below the date/time line (not beside it) - side-by-side
      // fit fine on the original wide landscape canvas, but collide in
      // App Style's narrower rotated canvas.
      if (app_style) {
        it.print(it.get_width() / 2, 6 + 18 + 6 + 14, id(font_tiny), id(col_grey),
                  TextAlign::TOP_CENTER, last_update_buf);
      } else {
        it.print(10, 6 + 18 + 6 + 14, id(font_tiny), id(col_grey),
                  TextAlign::TOP_LEFT, last_update_buf);
      }

      bool soc_valid = use_push ? !isnan(id(battery_soc_push).state) : id(battery_soc_valid);
      float soc = use_push ? id(battery_soc_push).state : id(battery_soc_g);
      float soc_on_th = (use_push && !isnan(id(soc_turn_on_push).state)) ? id(soc_turn_on_push).state : id(soc_turn_on_g);
      float soc_off_th = (use_push && !isnan(id(soc_turn_off_push).state)) ? id(soc_turn_off_push).state : id(soc_turn_off_g);

      bool vc_valid = use_push ? !isnan(id(battery_voltage_push).state) : id(battery_vc_valid);
      float voltage = use_push ? id(battery_voltage_push).state : id(battery_voltage_g);
      float current = use_push ? id(battery_current_push).state : id(battery_current_g);

      bool bm2_valid = use_push ? !isnan(id(bm2_voltage_push).state) : id(bm2_voltage_valid);
      float bm2_voltage = use_push ? id(bm2_voltage_push).state : id(bm2_voltage_g);

      bool bm2_percent_valid_disp = use_push ? !isnan(id(bm2_percent_push).state) : id(bm2_percent_valid);
      float bm2_percent = use_push ? id(bm2_percent_push).state : id(bm2_percent_g);

      bool pv_valid_disp = use_push
          ? (!isnan(id(pv_power_push).state) && !isnan(id(pv_current_push).state) && !isnan(id(pv_voltage_push).state))
          : id(pv_valid);
      float pv_power = use_push ? id(pv_power_push).state : id(pv_power_g);
      float pv_current = use_push ? id(pv_current_push).state : id(pv_current_g);
      float pv_voltage = use_push ? id(pv_voltage_push).state : id(pv_voltage_g);
      // "Charging" here means the PV array is actively producing into the
      // battery (not the AC charger relay) - green while panels are
      // contributing power, red when they aren't (night, heavy cloud, etc).
      bool pv_charging = pv_valid_disp && pv_power > 0.0f;
      Color pv_label_color = pv_charging ? id(col_green) : id(col_red);

      std::string renogy_charging_status = use_push
          ? (id(renogy_charging_status_push).has_state() ? id(renogy_charging_status_push).state : "")
          : id(renogy_charging_status_g);
      bool solar_charging = renogy_charging_status == "mppt";

      bool charging_valid = use_push ? id(charger_should_run_push).has_state() : id(charger_should_run_valid);
      bool charging = charging_valid && (use_push ? id(charger_should_run_push).state : id(charger_should_run_g));
      std::string mode = use_push
          ? (id(charger_mode_push).has_state() ? id(charger_mode_push).state : "?")
          : (id(charger_mode_g).empty() ? "?" : id(charger_mode_g));

      bool power_valid = use_push ? !isnan(id(battery_power_push).state) : id(battery_power_valid);
      float power = use_push ? id(battery_power_push).state : id(battery_power_g);
      float consumed_ah = use_push ? id(consumed_ah_push).state : id(consumed_ah_g);
      bool time_left_valid = use_push ? !isnan(id(time_remaining_push).state) : id(time_remaining_valid);
      float time_left = use_push ? id(time_remaining_push).state : id(time_remaining_g);
      bool status_valid = use_push ? id(battery_status_push).has_state() : id(battery_status_valid);
      std::string status = use_push
          ? (id(battery_status_push).has_state() ? id(battery_status_push).state : "")
          : id(battery_status_g);

      // Shared "time remaining" text, used by both display modes - only
      // meaningful while discharging; while charging/idle, shows the
      // Battery Status reason (Charging/Idle/etc.) instead of a bare "--".
      char time_part[24];
      if (time_left_valid) {
        if (time_left >= 24.0f) {
          int days = static_cast<int>(time_left / 24.0f);
          int rem_hours = static_cast<int>(time_left) % 24;
          snprintf(time_part, sizeof(time_part), "%dd %dh left", days, rem_hours);
        } else {
          snprintf(time_part, sizeof(time_part), "%.1fh left", time_left);
        }
      } else if (status_valid && status != "Unknown") {
        snprintf(time_part, sizeof(time_part), "%s", status.c_str());
      } else {
        snprintf(time_part, sizeof(time_part), "--h left");
      }

      if (app_style) {
        // ----- App Style: approximates the Renogy app's home screen
        // (horizontal SoC bar + Output stat rows) using basic display
        // primitives only - no gradients or vector icons available on
        // this display. Positions are relative to it.get_width()/
        // get_height() rather than hardcoded, since the actual canvas
        // size after set_rotation() combines with this board's static
        // swap_xy transform in a way that hasn't been verified on
        // hardware yet - relative positioning stays correct regardless
        // of what that combination actually produces. -----
        int w = it.get_width();
        int h = it.get_height();
        // Bar replaces the old circular gauge - shorter vertically, which
        // frees up room for extra stat rows (e.g. BM2 Voltage) below.
        // Anchored below a fixed header clearance so it never overlaps the
        // "SOLAR BATTERY MONITOR" / "Updated..." header lines regardless
        // of canvas size.
        int header_clearance = 62;
        int bar_x = static_cast<int>(w * 0.08f);
        int bar_w = static_cast<int>(w * 0.84f);
        // Bars shrunk (was 0.08h) to make room for a second bar (BM2) plus
        // the extra PV rows below - height/font all reduced together so
        // nothing overlaps or runs off the bottom of the 320px canvas.
        int bar_h = static_cast<int>(h * 0.05f);
        int bar_gap = static_cast<int>(h * 0.015f);

        // Helper draws one label+value-on-bar row: background track, a
        // color-coded fill proportional to pct, and label/value text
        // overlaid directly on the bar (same line, left/right split) so
        // it can't collide with anything else on screen.
        auto draw_bar = [&](int y, bool valid, float pct, const char* label, Color fill_color) {
          it.filled_rectangle(bar_x, y, bar_w, bar_h, id(col_dark_teal));
          if (valid) {
            float clamped = std::min(std::max(pct, 0.0f), 100.0f);
            int fill_w = static_cast<int>(bar_w * clamped / 100.0f);
            if (fill_w > 0) it.filled_rectangle(bar_x, y, fill_w, bar_h, fill_color);
          }
          char pctbuf[8];
          if (valid) snprintf(pctbuf, sizeof(pctbuf), "%.0f%%", pct);
          else snprintf(pctbuf, sizeof(pctbuf), "--");
          it.print(bar_x + 6, y + bar_h / 2, id(font_tiny), id(col_white), TextAlign::CENTER_LEFT, label);
          it.print(bar_x + bar_w - 6, y + bar_h / 2, id(font_tiny), id(col_white), TextAlign::CENTER_RIGHT, pctbuf);
        };

        Color soc_bar_color = id(col_green);
        if (soc_valid) {
          if (soc <= soc_on_th) soc_bar_color = id(col_red);
          else if (soc < soc_off_th) soc_bar_color = id(col_yellow);
        }
        int bar1_y = header_clearance;
        draw_bar(bar1_y, soc_valid, soc, "Renogy", soc_bar_color);

        int bar2_y = bar1_y + bar_h + bar_gap;
        draw_bar(bar2_y, bm2_percent_valid_disp, bm2_percent, "BM2", id(col_teal));

        // Battery Status, on its own line directly below the bars.
        int status_y = bar2_y + bar_h + static_cast<int>(h * 0.035f);
        if (status_valid && !status.empty()) {
          it.print(w / 2, status_y, id(font_tiny), id(col_teal),
                    TextAlign::CENTER, status.c_str());
        }

        // Sun icon (filled circle + 8 rays, drawn with primitives only -
        // no icon font/vector graphics on this display) - shown on the
        // status line whenever Renogy reports actively MPPT solar
        // charging. Left-aligned so it doesn't collide with the centered
        // status text next to it.
        if (solar_charging) {
          int sun_cx = bar_x + 8;
          int sun_cy = status_y;
          int sun_r = 5;
          it.filled_circle(sun_cx, sun_cy, sun_r, id(col_yellow));
          for (int deg = 0; deg < 360; deg += 45) {
            float a = deg * 3.14159265f / 180.0f;
            int x1 = sun_cx + static_cast<int>((sun_r + 2) * cos(a));
            int y1 = sun_cy + static_cast<int>((sun_r + 2) * sin(a));
            int x2 = sun_cx + static_cast<int>((sun_r + 5) * cos(a));
            int y2 = sun_cy + static_cast<int>((sun_r + 5) * sin(a));
            it.line(x1, y1, x2, y2, id(col_yellow));
          }
        }

        // Rows stack below the bars (portrait-style, matching the app's
        // layout) rather than beside it - correct regardless of whether
        // the rotated canvas ends up wide or tall, since it's all
        // relative to w/h rather than assuming a particular orientation.
        // Spacing/font both shrunk from earlier versions to fit 9 rows
        // (was 6) in the space available above the charger status banner.
        int row_spacing = static_cast<int>(h * 0.06f);
        int row_y = status_y + static_cast<int>(h * 0.045f);
        int icon_x = static_cast<int>(w * 0.08f);
        int icon_r = static_cast<int>(w * 0.03f);
        int label_x = static_cast<int>(w * 0.17f);
        int value_x = static_cast<int>(w * 0.92f);
        auto draw_row = [&](const char* icon_letter, const char* label, const char* value, Color label_color) {
          it.filled_circle(icon_x, row_y, icon_r, id(col_dark_teal));
          it.print(icon_x, row_y, id(font_tiny), id(col_teal), TextAlign::CENTER, icon_letter);
          it.print(label_x, row_y, id(font_small), label_color, TextAlign::CENTER_LEFT, label);
          it.print(value_x, row_y, id(font_small), id(col_teal), TextAlign::CENTER_RIGHT, value);
          row_y += row_spacing;
        };

        char vbuf2[16];
        if (vc_valid) snprintf(vbuf2, sizeof(vbuf2), "%.2fV", voltage); else snprintf(vbuf2, sizeof(vbuf2), "--");
        draw_row("V", "Renogy Voltage", vbuf2, id(col_white));

        char bm2buf[16];
        if (bm2_valid) snprintf(bm2buf, sizeof(bm2buf), "%.2fV", bm2_voltage); else snprintf(bm2buf, sizeof(bm2buf), "--");
        draw_row("V", "BM2 Voltage", bm2buf, id(col_white));

        char pvpbuf[16];
        if (pv_valid_disp) snprintf(pvpbuf, sizeof(pvpbuf), "%.0fW", pv_power); else snprintf(pvpbuf, sizeof(pvpbuf), "--");
        draw_row("W", "PV Power", pvpbuf, pv_label_color);

        char pvcbuf[16];
        if (pv_valid_disp) snprintf(pvcbuf, sizeof(pvcbuf), "%.1fA", pv_current); else snprintf(pvcbuf, sizeof(pvcbuf), "--");
        draw_row("A", "PV Current", pvcbuf, pv_label_color);

        char pvvbuf[16];
        if (pv_valid_disp) snprintf(pvvbuf, sizeof(pvvbuf), "%.2fV", pv_voltage); else snprintf(pvvbuf, sizeof(pvvbuf), "--");
        draw_row("V", "PV Voltage", pvvbuf, pv_label_color);

        char cbuf2[16];
        if (vc_valid) snprintf(cbuf2, sizeof(cbuf2), "%.1fA", current); else snprintf(cbuf2, sizeof(cbuf2), "--");
        draw_row("A", "Current", cbuf2, id(col_white));

        char pbuf2[16];
        if (power_valid) snprintf(pbuf2, sizeof(pbuf2), "%.0fW", power); else snprintf(pbuf2, sizeof(pbuf2), "--");
        draw_row("W", "Power", pbuf2, id(col_white));

        char ahbuf2[16];
        snprintf(ahbuf2, sizeof(ahbuf2), "%.1fAh", consumed_ah);
        draw_row("Ah", "Consumed Ah", ahbuf2, id(col_white));

        draw_row("T", "Time left", time_part, id(col_white));
      } else {
        // ----- Classic layout (unchanged) -----
        if (!soc_valid) {
          it.print(it.get_width() / 2, 90, id(font_medium), id(col_grey),
                    TextAlign::CENTER, "NO DATA");
        } else {
          Color soc_color = id(col_green);
          if (soc <= soc_on_th) {
            soc_color = id(col_red);
          } else if (soc < soc_off_th) {
            soc_color = id(col_yellow);
          }

          char buf[16];
          snprintf(buf, sizeof(buf), "%.0f%%", soc);
          it.print(it.get_width() / 2, 90, id(font_huge), soc_color,
                    TextAlign::CENTER, buf);
        }

        char vbuf[24];
        if (vc_valid) {
          snprintf(vbuf, sizeof(vbuf), "%.2f V   %.2f A", voltage, current);
        } else {
          snprintf(vbuf, sizeof(vbuf), "-- V   -- A");
        }
        it.print(it.get_width() / 2, 150, id(font_medium), id(col_white),
                  TextAlign::CENTER, vbuf);

        char pbuf[48];
        if (power_valid) {
          snprintf(pbuf, sizeof(pbuf), "%.0fW  %.1fAh  %s", power, consumed_ah, time_part);
        } else {
          snprintf(pbuf, sizeof(pbuf), "-- W  -- Ah  --h left");
        }
        it.print(it.get_width() / 2, 178, id(font_small_bold), id(col_grey),
                  TextAlign::CENTER, pbuf);

        char bm2buf3[24];
        if (bm2_valid) {
          snprintf(bm2buf3, sizeof(bm2buf3), "BM2 Voltage: %.2f V", bm2_voltage);
        } else {
          snprintf(bm2buf3, sizeof(bm2buf3), "BM2 Voltage: -- V");
        }
        it.print(it.get_width() / 2, 196, id(font_tiny), id(col_teal),
                  TextAlign::CENTER, bm2buf3);
      }

      // Charger status banner - shared across both display modes, since
      // it's specific to this project's charger-control feature rather
      // than part of the app screen being mimicked. Shorter + smaller
      // font in App Style, where vertical space is already tight with
      // five stat rows below the gauge; Classic keeps its original size.
      int banner_h = app_style ? 26 : 40;
      Color bar_color = charging ? id(col_green) : id(col_grey);
      it.filled_rectangle(0, it.get_height() - banner_h, it.get_width(), banner_h, bar_color);
      char sbuf[48];
      snprintf(sbuf, sizeof(sbuf), "CHARGER %s (%s)",
                charging_valid ? (charging ? "ON" : "OFF") : "?",
                mode.c_str());
      it.print(it.get_width() / 2, it.get_height() - banner_h / 2,
                app_style ? id(font_tiny) : id(font_small_bold),
                id(col_black), TextAlign::CENTER, sbuf);
