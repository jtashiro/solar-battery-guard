                        if (!root["state"].is<const char*>()) return false;
                        std::string state = root["state"].as<std::string>();
                        auto val = parse_number<float>(state);
                        if (val.has_value()) {
                          id(bm2_voltage_g) = *val;
                          id(bm2_voltage_valid) = true;
                        }
                        return true;
                      });
              on_error:
                then:
                  - lambda: |-
                      id(bm2_voltage_valid) = false;
                      ESP_LOGW("ha_poll", "Failed to fetch bm2_voltage");

          - http_request.get:
