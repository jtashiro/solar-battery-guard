# ---------------------------------------------------------------------------
# Solar Battery Monitor - a SEPARATE ESP32 CYD board (same LCDWIKI
# ESP32-32E/E32R28T hardware as the main solar-battery-guard unit) that
# acts as a pure display-only viewer. It has no shunt wired to it and does
# not control the charger - it just pulls the already-computed battery
# status live from Home Assistant and shows it on screen.
#
# Data source: this polls Home Assistant's REST API directly on a timer
# (see the `interval:` block below), rather than using ESPHome's
# `platform: homeassistant` push-subscription mechanism. That mechanism
# was tried first but proved unreliable in practice - it depends on Home
# Assistant proactively sending a specific subscription-request message
# that, for reasons not fully pinned down, wasn't reliably happening in
# this setup, and separately, ESPHome's homeassistant sensor platform is
# documented to not forward unchanged values even when force_update is
# set (esphome/esphome#13351). Polling sidesteps both problems with a
# plain, predictable request/response cycle.
#
# Requires the main solar-battery-guard device to already be set up and
# its entities present in Home Assistant, since every value shown here is
# read from that device's entities.
# ---------------------------------------------------------------------------
substitutions:
  name: solar-battery-monitor
  friendly_name: "Solar Battery Monitor"
  ha_url: !secret ha_base_url
  ha_token: !secret ha_long_lived_token
  poll_interval: 10s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "ESP32 CYD - read-only battery status viewer (polls Home Assistant REST API)"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret monitor_api_encryption_key

ota:
  platform: esphome
  password: !secret monitor_ota_password

time:
  - platform: homeassistant
    id: ha_time

improv_serial:

http_request:
  id: ha_http
  useragent: solar-battery-monitor
  timeout: 5s

# ---------------------------------------------------------------------------
# Live values, updated by the polling block further down. Storing these as
# plain globals (rather than sensor/binary_sensor/text_sensor entities)
# since nothing here needs to be re-exposed as a new Home Assistant entity
# - the display lambda reads them directly.
# ---------------------------------------------------------------------------
globals:
  - id: battery_soc_g
    type: float
    restore_value: no
    initial_value: '0'
  - id: battery_soc_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: battery_voltage_g
    type: float
    restore_value: no
    initial_value: '0'
  - id: battery_current_g
    type: float
    restore_value: no
    initial_value: '0'
  - id: battery_vc_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: bm2_voltage_g
    type: float
    restore_value: no
    initial_value: '0'
  - id: bm2_voltage_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: pv_power_g
    type: float
    restore_value: no
    initial_value: '0'
  - id: pv_current_g
    type: float
    restore_value: no
    initial_value: '0'
  - id: pv_voltage_g
    type: float
    restore_value: no
    initial_value: '0'
  - id: pv_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: bm2_percent_g
    type: float
    restore_value: no
    initial_value: '0'
  - id: bm2_percent_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: renogy_charging_status_g
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: soc_turn_on_g
    type: float
    restore_value: no
    initial_value: '30'
  - id: soc_turn_off_g
    type: float
    restore_value: no
    initial_value: '90'
  - id: charger_should_run_g
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: charger_should_run_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: charger_mode_g
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: battery_power_g
    type: float
    restore_value: no
    initial_value: '0'
  - id: battery_power_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: consumed_ah_g
    type: float
    restore_value: no
    initial_value: '0'
  - id: time_remaining_g
    type: float
    restore_value: no
    initial_value: '0'
  - id: time_remaining_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: battery_status_g
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: battery_status_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  # Tracks when data was last actually received from Home Assistant (not
  # just when the display last redrew) - a stuck timestamp here means
  # polling has stopped succeeding, e.g. wifi/HA/token trouble.
  - id: last_update_hour
    type: int
    restore_value: no
    initial_value: '-1'
  - id: last_update_minute
    type: int
    restore_value: no
    initial_value: '-1'
  - id: last_update_second
    type: int
    restore_value: no
    initial_value: '-1'
  # Incremented on every tap that's provisionally treated as a single tap;
  # lets the delayed single-tap action (below) tell whether a second tap
  # arrived in the meantime and cancel itself, since a scheduled callback
  # can't otherwise be "unscheduled" mid-flight.
  - id: touch_seq
    type: uint32_t
    restore_value: no
    initial_value: '0'

# ---------------------------------------------------------------------------
# Lets you switch, live from Home Assistant, between the two data-sourcing
# mechanisms this device supports - useful for comparing them directly now
# that the push-subscription mechanism's original failure is understood to
# have likely been mostly a wrong-entity-name issue (see README) rather
# than a deeper protocol problem. HTTP polling remains the default since
# its failures are loud (an explicit 404 in the log) where the push
# mechanism's are silent.
# ---------------------------------------------------------------------------
select:
  - platform: template
    id: data_source_mode
    name: "Data Source"
    options:
      - "HTTP Polling"
      - "Push Subscription"
    initial_option: "Push Subscription"
    restore_value: true
    optimistic: true

  - platform: template
    id: display_mode
    name: "Display Mode"
    options:
      - "Classic"
      - "App Style"
    initial_option: "Classic"
    restore_value: true
    optimistic: true

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  # --- Push-subscription mechanism, running in parallel to HTTP polling.
  # internal: true since these are only read locally by the display
  # lambda, not meant to be re-exposed as new Home Assistant entities. ---
  - platform: homeassistant
    id: battery_soc_push
    entity_id: sensor.solar_battery_guard_battery_soc
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(data_source_mode).state == "Push Subscription") {
              auto now = id(ha_time).now();
              if (now.is_valid()) {
                id(last_update_hour) = now.hour;
                id(last_update_minute) = now.minute;
                id(last_update_second) = now.second;
              }
            }

  - platform: homeassistant
    id: battery_voltage_push
    entity_id: sensor.si_mining_shed_solar_battery_guard_renogy_battery_voltage
    internal: true

  - platform: homeassistant
    id: bm2_voltage_push
    entity_id: sensor.si_mining_shed_bm2_battery_monitor_9598_voltage
    internal: true

  - platform: homeassistant
    id: bm2_percent_push
    entity_id: sensor.si_mining_shed_bm2_battery_monitor_9598_percent
    internal: true

  - platform: homeassistant
    id: pv_power_push
    entity_id: sensor.renogy_controller_renogy_pv_power
    internal: true

  - platform: homeassistant
    id: pv_current_push
    entity_id: sensor.renogy_controller_renogy_pv_current
    internal: true

  - platform: homeassistant
    id: pv_voltage_push
    entity_id: sensor.renogy_controller_renogy_pv_voltage
    internal: true

  - platform: homeassistant
    id: battery_current_push
    entity_id: sensor.solar_battery_guard_battery_current
    internal: true

  - platform: homeassistant
    id: soc_turn_on_push
    entity_id: number.solar_battery_guard_charger_turn_on_soc
    internal: true

  - platform: homeassistant
    id: soc_turn_off_push
    entity_id: number.solar_battery_guard_charger_turn_off_soc
    internal: true

  - platform: homeassistant
    id: battery_power_push
    entity_id: sensor.solar_battery_guard_battery_power
    internal: true

  - platform: homeassistant
    id: consumed_ah_push
    entity_id: sensor.solar_battery_guard_consumed_ah
    internal: true

  - platform: homeassistant
    id: time_remaining_push
    entity_id: sensor.solar_battery_guard_time_remaining
    internal: true

binary_sensor:
  - platform: homeassistant
    id: charger_should_run_push
    entity_id: binary_sensor.solar_battery_guard_ac_charger_should_run
    internal: true

text_sensor:
  - platform: homeassistant
    id: charger_mode_push
    entity_id: select.solar_battery_guard_charger_mode
    internal: true

  - platform: homeassistant
    id: battery_status_push
    entity_id: sensor.si_mining_shed_solar_battery_guard_battery_status
    internal: true

  - platform: homeassistant
    id: renogy_charging_status_push
    entity_id: sensor.renogy_controller_renogy_charging_status
    internal: true

# ---------------------------------------------------------------------------
# Polling: fetches each entity's current state from Home Assistant's REST
# API (GET /api/states/<entity_id>) once per poll_interval, but only while
# "Data Source" is set to HTTP Polling - skipped entirely in Push
# Subscription mode to avoid pointless API load. If you renamed/re-paired
# the main device and its entity IDs differ from these defaults, update
# the URLs below to match.
# ---------------------------------------------------------------------------
interval:
  - interval: ${poll_interval}
    then:
      - if:
          condition:
            lambda: 'return id(data_source_mode).state == "HTTP Polling";'
          then:
          - http_request.get:
              url: "${ha_url}/api/states/sensor.solar_battery_guard_battery_soc"
              request_headers:
                Authorization: "Bearer ${ha_token}"
              capture_response: true
              max_response_buffer_size: 2kB
              on_response:
                then:
                  - lambda: |-
                      json::parse_json(body, [](JsonObject root) -> bool {
                        if (!root["state"].is<const char*>()) return false;
                        std::string state = root["state"].as<std::string>();
                        auto val = parse_number<float>(state);
                        if (val.has_value()) {
                          id(battery_soc_g) = *val;
                          id(battery_soc_valid) = true;
                          auto now = id(ha_time).now();
                          if (now.is_valid()) {
                            id(last_update_hour) = now.hour;
                            id(last_update_minute) = now.minute;
                            id(last_update_second) = now.second;
                          }
                        }
                        return true;
                      });
              on_error:
                then:
                  - lambda: |-
                      id(battery_soc_valid) = false;
                      ESP_LOGW("ha_poll", "Failed to fetch battery_soc");
    
          - http_request.get:
              url: "${ha_url}/api/states/sensor.si_mining_shed_solar_battery_guard_renogy_battery_voltage"
              request_headers:
                Authorization: "Bearer ${ha_token}"
              capture_response: true
