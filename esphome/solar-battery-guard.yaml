substitutions:
  name: solar-battery-guard
  friendly_name: "Solar Battery Guard"

  # --- Charger control thresholds (also adjustable live from Home Assistant
  #     as number entities once flashed) ---
  soc_turn_on_default: "30"    # % SoC at/below which the AC charger turns ON
  soc_turn_off_default: "90"   # % SoC at/above which the AC charger turns OFF

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "ESP32 CYD - battery monitor + AC charger controller"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

improv_serial:

# ---------------------------------------------------------------------------
# TBD-SmartShunt (FE-Shunt app) battery monitor, read over its UART-TTL port
# (JST-PH 4-pin: 5V/blue, GND/green, TXD/yellow, RXD/orange). Wire ONLY:
#   Shunt TXD (yellow) -> [10k/20k voltage divider] -> ESP32 GPIO27 (rx_pin)
#   Shunt GND  (green)  -> ESP32 GND
# The shunt's TXD is 5V logic - the ESP32's GPIO is only 3.3V-tolerant, so
# TXD MUST go through a voltage divider (10k to signal, 20k to GND, tap to
# GPIO27) before reaching the ESP32. Do NOT wire the shunt's 5V (blue) pin
# to the ESP32 - the CYD has its own separate 5V supply. Do NOT wire the
# shunt's RXD (orange) at all - the ESP32 never transmits to the shunt, so
# no tx_pin is configured below.
#
# GPIO27 (not GPIO22) is used here: per LCDWIKI's own pin table for this
# exact board (E32R28T/ESP32-32E), GPIO22 is committed to the onboard red
# LED, and GPIO4 is used as the display's reset pin - both contrary to
# generic "CYD" pinout guides. GPIO27 and the input-only GPIO35 are the two
# GPIOs actually left free - see README for the full confirmed pin map.
# ---------------------------------------------------------------------------
external_components:
  - source: github://webbbn/esphome-tbd-smartshunt
    components: [ tbd_smart_shunt ]

uart:
  id: shunt_uart
  rx_pin: GPIO27
  baud_rate: 115200
  data_bits: 8
  stop_bits: 1
  parity: NONE
  rx_buffer_size: 256

tbd_smart_shunt:
  uart_id: shunt_uart

# ---------------------------------------------------------------------------
# Coulomb-counting state. The shunt only reports instantaneous voltage/
# current, so SoC% is derived here by integrating power over time against a
# configured capacity. This MUST be calibrated after install (see README):
# set "battery capacity" to your bank's real usable kWh, then press
# "set charged state" once when the bank is actually full, and
# "set discharged state" once when it's actually at your low cutoff.
# Until calibrated, SoC will read 0%.
# ---------------------------------------------------------------------------
globals:
  - id: total_energy_in
    type: float
    restore_value: yes
    initial_value: '0'
  - id: total_energy_out
    type: float
    restore_value: yes
    initial_value: '0'
  - id: capacity
    type: float
    restore_value: yes
    initial_value: '0'
  - id: current_stored_energy
    type: float
    restore_value: yes
    initial_value: '0'
  - id: efficiency
    type: float
    restore_value: yes
    initial_value: '1'
  - id: reset_energy_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: set_charged_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: set_discharged_state
    type: bool
    restore_value: no
    initial_value: 'false'

preferences:
  flash_write_interval: 5min

number:
  - platform: template
    id: battery_capacity_kwh
    name: "${friendly_name} Battery Capacity"
    unit_of_measurement: "kWh"
    max_value: 100
    min_value: 0.1
    step: 0.1
    update_interval: 5s
    lambda: return id(capacity) / 1000.0;
    set_action:
      lambda: id(capacity) = x * 1000.0;

  - platform: template
    id: battery_charge_efficiency
    name: "${friendly_name} Charge Efficiency"
    max_value: 2.0
    min_value: 0.5
    step: 0.01
    update_interval: 5s
    lambda: return id(efficiency);
    set_action:
      lambda: id(efficiency) = x;

  - platform: template
    id: soc_turn_on_threshold
    name: "${friendly_name} Charger Turn-On SoC"
    unit_of_measurement: "%"
    min_value: 5
    max_value: 95
    step: 1
    initial_value: ${soc_turn_on_default}
    restore_value: true
    optimistic: true

  - platform: template
    id: soc_turn_off_threshold
    name: "${friendly_name} Charger Turn-Off SoC"
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 1
    initial_value: ${soc_turn_off_default}
    restore_value: true
    optimistic: true

select:
  - platform: template
    id: charger_override_mode
    name: "${friendly_name} Charger Mode"
    options:
      - "Auto"
      - "Force ON"
      - "Force OFF"
    initial_option: "Auto"
    restore_value: true
    optimistic: true

switch:
  - platform: template
    name: "${friendly_name} Reset Energy Stats"
    lambda: return id(reset_energy_state);
    turn_on_action:
      - lambda: |-
          id(total_energy_in) = 0.0;
          id(total_energy_out) = 0.0;
      - switch.template.publish:
          id: reset_energy_stats_sw
          state: OFF
    id: reset_energy_stats_sw

  - platform: template
    name: "${friendly_name} Set Charged State (calibrate 100%)"
    lambda: return id(set_charged_state);
    turn_on_action:
      - lambda: id(current_stored_energy) = id(capacity);
      - switch.template.publish:
          id: set_charged_sw
          state: OFF
    id: set_charged_sw

  - platform: template
    name: "${friendly_name} Set Discharged State (calibrate low point)"
    lambda: return id(set_discharged_state);
    turn_on_action:
      - lambda: id(current_stored_energy) = 0.0;
      - switch.template.publish:
          id: set_discharged_sw
          state: OFF
    id: set_discharged_sw

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: tbd_smart_shunt
    battery_voltage:
      name: "${friendly_name} Battery Voltage"
      id: batt_voltage
      accuracy_decimals: 2
    battery_current:
      name: "${friendly_name} Battery Current"
      id: batt_current
      accuracy_decimals: 2
    instantaneous_power:
      id: batt_power
      internal: true
      on_value:
        then:
          lambda: |-
            static uint32_t last_update_time = 0;
            if (last_update_time != 0) {
              uint32_t dt = millis() - last_update_time;
              float energy = x * static_cast<float>(dt) / (1000.0f * 3600.0f);
              if (energy < 0) {
                energy = -energy;
                id(total_energy_out) += energy;
                if (energy > id(current_stored_energy)) {
                  id(current_stored_energy) = 0;
                } else {
                  id(current_stored_energy) -= energy;
                }
              } else {
                energy *= id(efficiency);
                id(total_energy_in) += energy;
                float new_capacity = id(current_stored_energy) + energy;
                id(current_stored_energy) = std::min(new_capacity, id(capacity));
              }
            }
            last_update_time = millis();

  - platform: template
    id: battery_soc
    name: "${friendly_name} Battery SoC"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    device_class: battery
    update_interval: 5s
    lambda: |-
      if (id(capacity) <= 0) return NAN;
      float pct = 100.0f * id(current_stored_energy) / id(capacity);
      if (pct < 0) pct = 0;
      if (pct > 100) pct = 100;
      return pct;

  - platform: template
    name: "${friendly_name} Total Charge Energy"
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: return id(total_energy_in) / 1000.0;

  - platform: template
    name: "${friendly_name} Total Discharge Energy"
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: return id(total_energy_out) / 1000.0;

binary_sensor:
  - platform: template
    id: charger_should_run
    name: "${friendly_name} AC Charger Should Run"
    device_class: power
    lambda: |-
      std::string mode = id(charger_override_mode).state;
      if (mode == "Force ON") return true;
      if (mode == "Force OFF") return false;

      if (isnan(id(battery_soc).state)) return {};  // no data yet / uncalibrated

      float soc = id(battery_soc).state;
      float on_th = id(soc_turn_on_threshold).state;
      float off_th = id(soc_turn_off_threshold).state;

      if (soc <= on_th) return true;
      if (soc >= off_th) return false;
      return {};  // inside the hysteresis band: hold previous state

# ---------------------------------------------------------------------------
# Display: 2.8" ILI9341, wired internally on the CYD - no reset pin broken
# out (tied to EN), so it's omitted below.
# ---------------------------------------------------------------------------
spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "${friendly_name} Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

color:
  - id: col_white
    hex: "FFFFFF"
  - id: col_black
    hex: "000000"
  - id: col_green
    hex: "2ECC71"
  - id: col_red
    hex: "E74C3C"
  - id: col_yellow
    hex: "F1C40F"
  - id: col_grey
    hex: "888888"

font:
  - file: "gfonts://Roboto"
    id: font_huge
    size: 56
  - file: "gfonts://Roboto"
    id: font_medium
    size: 24
  - file: "gfonts://Roboto@700"
    id: font_small_bold
    size: 18

display:
  - platform: ili9xxx
    model: ILI9341
    spi_id: tft_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4
    color_palette: 8BIT
    dimensions:
      width: 320
      height: 240
    transform:
      swap_xy: true
    invert_colors: false
    update_interval: 1s
    lambda: |-
      it.fill(id(col_black));

      // Header
      it.print(10, 6, id(font_small_bold), id(col_grey), "SOLAR BATTERY GUARD");

      // Battery SoC (big number, center)
      if (isnan(id(battery_soc).state)) {
        it.print(it.get_width() / 2, 90, id(font_medium), id(col_grey),
                  TextAlign::CENTER, "NO SHUNT DATA");
      } else {
        float soc = id(battery_soc).state;
        Color soc_color = id(col_green);
        if (soc <= id(soc_turn_on_threshold).state) soc_color = id(col_red);
        else if (soc < id(soc_turn_off_threshold).state) soc_color = id(col_yellow);

        char buf[16];
        snprintf(buf, sizeof(buf), "%.0f%%", soc);
        it.print(it.get_width() / 2, 90, id(font_huge), soc_color,
                  TextAlign::CENTER, buf);
      }

      // Voltage / current
      char vbuf[24];
      if (!isnan(id(batt_voltage).state)) {
        snprintf(vbuf, sizeof(vbuf), "%.2f V   %.2f A",
                  id(batt_voltage).state, id(batt_current).state);
      } else {
        snprintf(vbuf, sizeof(vbuf), "-- V   -- A");
      }
      it.print(it.get_width() / 2, 150, id(font_medium), id(col_white),
                TextAlign::CENTER, vbuf);

      // Charger status banner
      bool charging = id(charger_should_run).state;
      const char* mode = id(charger_override_mode).state.c_str();
      Color bar_color = charging ? id(col_green) : id(col_grey);
      it.filled_rectangle(0, it.get_height() - 40, it.get_width(), 40, bar_color);
      char sbuf[40];
      snprintf(sbuf, sizeof(sbuf), "CHARGER %s  (%s)",
                charging ? "ON" : "OFF", mode);
      it.print(it.get_width() / 2, it.get_height() - 20, id(font_small_bold),
                id(col_black), TextAlign::CENTER, sbuf);
