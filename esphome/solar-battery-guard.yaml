substitutions:
  name: solar-battery-guard
  friendly_name: "Solar Battery Guard"

  # --- Charger control thresholds (also adjustable live from Home Assistant
  #     as number entities once flashed) ---
  # SoC thresholds below are no longer what drives charger_should_run (see
  # Renogy voltage thresholds further down) - they're kept only for the
  # on-screen SoC gauge's red/yellow color bands.
  soc_turn_on_default: "70"    # % SoC at/below which the SoC gauge shows red
  soc_turn_off_default: "90"   # % SoC at/above which the SoC gauge stops showing yellow

  # Charger ON/OFF is driven by Renogy's battery voltage (via Home
  # Assistant) instead of the shunt's coulomb-counted SoC - the shunt's SoC
  # estimate drifts over days/weeks (see README), which caused the charger
  # to silently fail to trigger during an actual over-discharge event
  # (battery hit 10V manually-observed while the shunt still read well
  # above its SoC turn-on threshold). Voltage is a direct measurement with
  # no drift, so it's a more reliable trigger signal.
  charger_turn_on_voltage_default: "11.8"   # V at/below which the AC charger turns ON - kept just above Renogy's own 11.7V undervoltage alarm
  charger_turn_off_voltage_default: "13.6"  # V at/above which the AC charger turns OFF
  # Lower turn-on floor used only while Renogy reports actively MPPT solar
  # charging - the AC charger turning on while panels are already recovering
  # the battery appears to suppress MPPT output, so this avoids firing the
  # AC charger on a brief morning voltage dip that solar is about to fix on
  # its own.
  charger_turn_on_voltage_solar_default: "11.0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "ESP32 CYD - battery monitor + AC charger controller"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

# ---------------------------------------------------------------------------
# NOTE: bluetooth_proxy was tried here and reverted - this ESP32 (no PSRAM,
# already running WiFi + ILI9341 display + UART sensing) crashes during the
# BLE controller's own init before any of our components even run, and gets
# silently reverted by the bootloader's OTA rollback protection every time
# (confirmed via `esphome logs`: "OTA rollback detected! Rolled back from
# partition" on every attempt, with or without trimmed connection_slots/
# cache_services - so it's not a tunable-parameter problem, the base BT
# controller can't get enough contiguous heap alongside everything else
# already running here). Use a separate, dedicated ESP32 (nothing else on
# it) for the Renogy BLE proxy instead - see the second-device pattern this
# project already uses for solar_battery_monitor.yaml.
# ---------------------------------------------------------------------------

time:
  - platform: homeassistant
    id: ha_time

improv_serial:

# ---------------------------------------------------------------------------
# TBD-SmartShunt (FE-Shunt app) battery monitor, read over its UART-TTL port
# (4-pin JST: pin1 power/3.48V, pin2 TX, pin3 RX, pin4 GND - confirmed by
# multimeter on the actual unit). Wire ONLY:
#   Shunt TX (pin 2, ~3.38V idle) -> ESP32 IO35 (rx_pin, silkscreen-labeled
#   on the board's spare expansion header) - direct, no divider needed,
#   since 3.38V is safely within the ESP32's 3.3V-logic tolerance.
#   Shunt GND (pin 4) -> ESP32 GND
# Do NOT wire the shunt's power pin (pin 1) to the ESP32 - the CYD has its
# own separate 5V supply. Do NOT wire the shunt's RX (pin 3) at all - the
# ESP32 never transmits to the shunt, so no tx_pin is configured below.
# Do NOT use the board's dedicated "UART" JST port for this - despite the
# label, that port is wired to UART0, shared with the onboard USB-serial
# programming/console chip, not a spare bus for external devices.
#
# GPIO35 is input-only, which is fine since we only ever receive from the
# shunt. Per LCDWIKI's own pin table for this exact board (E32R28T/
# ESP32-32E), GPIO35 and GPIO27 are the only two GPIOs with no onboard
# function - GPIO35 was chosen here because it's directly silkscreen-
# labeled "IO35" on the board, removing any pin-identification ambiguity.
# See README for the full confirmed pin map.
# ---------------------------------------------------------------------------
external_components:
  - source: github://webbbn/esphome-tbd-smartshunt
    components: [ tbd_smart_shunt ]

uart:
  id: shunt_uart
  rx_pin: GPIO35
  baud_rate: 115200
  data_bits: 8
  stop_bits: 1
  parity: NONE
  rx_buffer_size: 256

tbd_smart_shunt:
  uart_id: shunt_uart

# ---------------------------------------------------------------------------
# Coulomb-counting state. The shunt only reports instantaneous voltage/
# current, so SoC% is derived here by integrating power over time against a
# configured capacity. This MUST be calibrated after install (see README):
# set "battery capacity" to your bank's real usable kWh, then press
# "set charged state" once when the bank is actually full, and
# "set discharged state" once when it's actually at your low cutoff.
# Until calibrated, SoC will read 0%.
# ---------------------------------------------------------------------------
globals:
  - id: total_energy_in
    type: float
    restore_value: yes
    initial_value: '0'
  - id: total_energy_out
    type: float
    restore_value: yes
    initial_value: '0'
  - id: capacity
    type: float
    restore_value: yes
    initial_value: '0'
  - id: current_stored_energy
    type: float
    restore_value: yes
    initial_value: '0'
  # Net Ah removed since the battery was last calibrated to 100% (Set
  # Charged State) - always <= 0, moves toward 0 while charging. Mirrors
  # current_stored_energy but in Ah instead of Wh, since the shunt itself
  # doesn't report a native "consumed Ah" field (see README).
  - id: consumed_ah
    type: float
    restore_value: yes
    initial_value: '0'
  - id: efficiency
    type: float
    restore_value: yes
    initial_value: '1'
  - id: reset_energy_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: set_charged_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: set_discharged_state
    type: bool
    restore_value: no
    initial_value: 'false'

preferences:
  flash_write_interval: 5min

number:
  - platform: template
    id: battery_capacity_kwh
    name: "Battery Capacity"
    unit_of_measurement: "kWh"
    max_value: 100
    min_value: 0.1
    step: 0.1
    update_interval: 5s
    lambda: return id(capacity) / 1000.0;
    set_action:
      lambda: id(capacity) = x * 1000.0;

  - platform: template
    id: battery_charge_efficiency
    name: "Charge Efficiency"
    max_value: 2.0
    min_value: 0.5
    step: 0.01
    update_interval: 5s
    lambda: return id(efficiency);
    set_action:
      lambda: id(efficiency) = x;

  - platform: template
    id: soc_turn_on_threshold
    name: "Charger Turn-On SoC"
    unit_of_measurement: "%"
    min_value: 5
    max_value: 95
    step: 1
    initial_value: ${soc_turn_on_default}
    restore_value: true
    optimistic: true

  - platform: template
    id: soc_turn_off_threshold
    name: "Charger Turn-Off SoC"
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 1
    initial_value: ${soc_turn_off_default}
    restore_value: true
    optimistic: true

  - platform: template
    id: charger_turn_on_voltage_threshold
    name: "Charger Turn-On Voltage"
    unit_of_measurement: "V"
    min_value: 8.0
    max_value: 14.0
    step: 0.1
    initial_value: ${charger_turn_on_voltage_default}
    restore_value: true
    optimistic: true

  - platform: template
    id: charger_turn_off_voltage_threshold
    name: "Charger Turn-Off Voltage"
    unit_of_measurement: "V"
    min_value: 8.0
    max_value: 15.0
    step: 0.1
    initial_value: ${charger_turn_off_voltage_default}
    restore_value: true
    optimistic: true

  - platform: template
    id: charger_turn_on_voltage_solar_threshold
    name: "Charger Turn-On Voltage (Solar Charging)"
    unit_of_measurement: "V"
    min_value: 8.0
    max_value: 14.0
    step: 0.1
    initial_value: ${charger_turn_on_voltage_solar_default}
    restore_value: true
    optimistic: true

  # --- Auto-calibrate-on-full thresholds. Mirrors what the FE-Shunt app
  # appears to do on its own: treat "voltage high + current tapered to
  # near-zero, sustained" as true full charge and re-anchor SoC to 100%,
  # instead of relying solely on the manual "Set Charged State" button.
  # Defaults are a starting guess for a 4S LiFePO4 bank (12.8V nominal) -
  # tune Voltage Threshold to match your charge controller's actual
  # float/absorption-complete voltage. ---
  - platform: template
    id: full_charge_voltage_threshold
    name: "Auto-Calibrate Voltage Threshold"
    unit_of_measurement: "V"
    min_value: 10.0
    max_value: 15.0
    step: 0.05
    initial_value: "13.6"
    restore_value: true
    optimistic: true

  - platform: template
    id: full_charge_tail_current_threshold
    name: "Auto-Calibrate Tail Current Threshold"
    unit_of_measurement: "A"
    min_value: 0.1
    max_value: 10.0
    step: 0.1
    initial_value: "1.0"
    restore_value: true
    optimistic: true

select:
  - platform: template
    id: charger_override_mode
    name: "Charger Mode"
    options:
      - "Auto"
      - "Force ON"
      - "Force OFF"
    initial_option: "Auto"
    restore_value: true
    optimistic: true

  # Renogy and BM2 read the same battery but disagree slightly (different
  # sense-lead placement/calibration), so let the reference source for the
  # ON/OFF voltage decision be picked from Home Assistant instead of hard
  # -coding Renogy. Defaults to Renogy since charger_turn_on/off thresholds
  # above were tuned against it.
  - platform: template
    id: charger_voltage_source
    name: "Charger Voltage Source"
    options:
      - "Renogy"
      - "BM2"
    initial_option: "Renogy"
    restore_value: true
    optimistic: true

  # --- TEMP DEBUG: lets you try different shunt UART baud rates live from
  # Home Assistant without reflashing. Watch `esphome logs` after changing
  # this - if "Last transmission too long ago" warnings stop and real
  # voltage/current values appear, that's the correct baud rate. Remove
  # this entity and hardcode the confirmed value in the uart: block above
  # once found. ---
  - platform: template
    id: shunt_baud_debug
    name: "DEBUG Shunt UART Baud Rate"
    options:
      - "115200"
      - "57600"
      - "38400"
      - "19200"
      - "9600"
    initial_option: "115200"
    optimistic: true
    set_action:
      - lambda: |-
          uint32_t baud = atoi(x.c_str());
          id(shunt_uart).set_baud_rate(baud);
          id(shunt_uart).load_settings(false);
          ESP_LOGI("shunt_baud_debug", "Switched shunt UART to %u baud", baud);

switch:
  - platform: template
    name: "Reset Energy Stats"
    lambda: return id(reset_energy_state);
    turn_on_action:
      - lambda: |-
          id(total_energy_in) = 0.0;
          id(total_energy_out) = 0.0;
      - switch.template.publish:
          id: reset_energy_stats_sw
          state: OFF
    id: reset_energy_stats_sw

  - platform: template
    name: "Set Charged State (calibrate 100%)"
    lambda: return id(set_charged_state);
    turn_on_action:
      - lambda: |-
          id(current_stored_energy) = id(capacity);
          id(consumed_ah) = 0.0;
      - switch.template.publish:
          id: set_charged_sw
          state: OFF
    id: set_charged_sw

  - platform: template
    name: "Auto-Calibrate On Full Charge"
    id: auto_calibrate_enabled
    icon: "mdi:refresh-auto"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Set Discharged State (calibrate low point)"
    lambda: return id(set_discharged_state);
    turn_on_action:
      - lambda: |-
          id(current_stored_energy) = 0.0;
          if (!isnan(id(batt_voltage).state) && id(batt_voltage).state > 0) {
            id(consumed_ah) = -(id(capacity) / id(batt_voltage).state);
          }
      - switch.template.publish:
          id: set_discharged_sw
          state: OFF
    id: set_discharged_sw

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  # Imported from Home Assistant rather than read locally - Renogy's
  # controller only talks BLE, and this ESP32 can't run bluetooth_proxy
  # alongside everything else it's already doing (see "Why there's no
  # on-device Bluetooth proxy" in the README). HA already has this value
  # via a separate Bluetooth adapter + HACS integration.
  - platform: homeassistant
    id: renogy_battery_voltage
    entity_id: sensor.renogy_controller_renogy_battery_voltage
    internal: true

  # homeassistant-platform sensors above are import-only and never register
  # as their own HA entity even when non-internal - this template sensor is
  # what actually re-publishes the imported Renogy voltage as a real entity
  # (sensor.solar_battery_guard_renogy_battery_voltage), for the monitor
  # device to pull from.
  - platform: template
    id: renogy_battery_voltage_display
    name: "Renogy Battery Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    update_interval: 5s
    lambda: return id(renogy_battery_voltage).state;

  - platform: homeassistant
    id: renogy_battery_percentage
    entity_id: sensor.renogy_controller_renogy_battery_percentage
    internal: true

  # BM2 clip-on monitor's own voltage reading, imported the same way as
  # Renogy's above - lets charger_should_run reference either source via
  # the "Charger Voltage Source" select.
  - platform: homeassistant
    id: bm2_battery_voltage
    entity_id: sensor.si_mining_shed_bm2_battery_monitor_9598_voltage
    internal: true

  - platform: template
    id: bm2_battery_voltage_display
    name: "BM2 Battery Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    update_interval: 5s
    lambda: return id(bm2_battery_voltage).state;

  - platform: tbd_smart_shunt
    battery_voltage:
      name: "Battery Voltage"
      id: batt_voltage
      accuracy_decimals: 2
    battery_current:
      name: "Battery Current"
      id: batt_current
      accuracy_decimals: 2
    instantaneous_power:
      name: "Battery Power"
      id: batt_power
      accuracy_decimals: 1
      device_class: power
      on_value:
        then:
          lambda: |-
            static uint32_t last_update_time = 0;
            if (last_update_time != 0) {
              uint32_t dt = millis() - last_update_time;

              // Ah accumulation (consumed_ah), independent of the Wh-based
              // SoC tracking below - straight coulomb counting on current.
              float ah_delta = id(batt_current).state * static_cast<float>(dt) / (1000.0f * 3600.0f);
              id(consumed_ah) = std::min(0.0f, id(consumed_ah) + ah_delta);

              float energy = x * static_cast<float>(dt) / (1000.0f * 3600.0f);
              if (energy < 0) {
                energy = -energy;
                id(total_energy_out) += energy;
                if (energy > id(current_stored_energy)) {
                  id(current_stored_energy) = 0;
                } else {
                  id(current_stored_energy) -= energy;
                }
              } else {
                energy *= id(efficiency);
                id(total_energy_in) += energy;
                float new_capacity = id(current_stored_energy) + energy;
                id(current_stored_energy) = std::min(new_capacity, id(capacity));
              }
            }
            last_update_time = millis();

  - platform: template
    id: battery_soc
    name: "Battery SoC"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    device_class: battery
    update_interval: 5s
    # Sourced from Renogy's own percentage (via Home Assistant) rather than
    # the shunt's coulomb-counted estimate below - the shunt's SoC drifts
    # over days/weeks (see README) and was found to mask a real
    # over-discharge event. current_stored_energy/capacity are still tracked
    # for Time Remaining and the Wh totals, just no longer surfaced as SoC%.
    lambda: return id(renogy_battery_percentage).state;

  - platform: template
    name: "Consumed Ah"
    unit_of_measurement: "Ah"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: return id(consumed_ah);

  - platform: template
    name: "Time Remaining"
    unit_of_measurement: "h"
    accuracy_decimals: 1
    icon: "mdi:timer-sand"
    update_interval: 5s
    lambda: |-
      // Only meaningful while discharging (negative power) with a
      // calibrated capacity - otherwise there's no sensible "time until
      // empty" estimate (charging, idle, or uncalibrated).
      if (id(capacity) <= 0 || isnan(id(batt_power).state) || id(batt_power).state >= 0) {
        return NAN;
      }
      return id(current_stored_energy) / -id(batt_power).state;

  - platform: template
    name: "Total Charge Energy"
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: return id(total_energy_in) / 1000.0;

  - platform: template
    name: "Total Discharge Energy"
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: return id(total_energy_out) / 1000.0;

text_sensor:
  # Imported from Home Assistant, same rationale as renogy_battery_voltage
  # above - lets charger_should_run tell whether the panels are actively
  # replenishing the battery before deciding to also turn on the AC charger.
  - platform: homeassistant
    id: renogy_charging_status
    entity_id: sensor.renogy_controller_renogy_charging_status
    internal: true

  - platform: template
    name: "Battery Status"
    icon: "mdi:battery-sync"
    update_interval: 5s
    lambda: |-
      if (isnan(id(batt_power).state)) return {"Unknown"};
      if (id(batt_power).state > 0) return {"Charging"};
      if (id(batt_power).state < 0) return {"Discharging"};
      return {"Idle"};

binary_sensor:
  # Fires once (edge-triggered via on_press) when voltage has been at/above
  # the threshold AND current tapered at/below the tail threshold,
  # continuously, for 15 minutes straight - the `delayed_on` filter resets
  # its timer any time the underlying condition goes false, so a cloud
  # passing over the panels mid-charge (a brief current spike) won't
  # falsely trigger a recalibration. Requires >= 0 current (charging or
  # idle, not discharging) so a lightly-loaded-but-not-actually-full battery
  # sitting near the voltage threshold on a cloudy day can't trigger it.
  - platform: template
    id: battery_at_float
    name: "Battery At Float"
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(batt_voltage).state) || isnan(id(batt_current).state)) return {};
      return id(batt_voltage).state >= id(full_charge_voltage_threshold).state
          && id(batt_current).state >= 0.0f
          && id(batt_current).state <= id(full_charge_tail_current_threshold).state;
    filters:
      - delayed_on: 15min
    on_press:
      then:
        - if:
            condition:
              lambda: return id(auto_calibrate_enabled).state;
            then:
              - lambda: |-
                  id(current_stored_energy) = id(capacity);
                  id(consumed_ah) = 0.0;
                  ESP_LOGI("auto_calibrate", "Auto-calibrated to 100%% - sustained float detected");

  - platform: template
    id: charger_should_run
    name: "AC Charger Should Run"
    device_class: power
    lambda: |-
      std::string mode = id(charger_override_mode).state;
      if (mode == "Force ON") return true;
      if (mode == "Force OFF") return false;

      // Voltage source is selectable (Renogy vs BM2) since the two sensors
      // read the same battery slightly differently - see "Charger Voltage
      // Source" select above.
      bool use_bm2 = id(charger_voltage_source).state == "BM2";
      float voltage = use_bm2 ? id(bm2_battery_voltage).state : id(renogy_battery_voltage).state;
      if (isnan(voltage)) return {};  // no data yet from HA

      // Lower turn-on floor while solar is actively charging - the AC
      // charger firing on a brief morning voltage dip that solar is about
      // to fix on its own appears to suppress MPPT output, so give the
      // panels more room to work with before also turning on the AC
      // charger. Turn-off threshold is unaffected - that logic doesn't
      // change based on solar status.
      bool solar_charging = id(renogy_charging_status).state == "mppt";
      float on_th = solar_charging
          ? id(charger_turn_on_voltage_solar_threshold).state
          : id(charger_turn_on_voltage_threshold).state;
      float off_th = id(charger_turn_off_voltage_threshold).state;

      if (voltage <= on_th) return true;
      if (voltage >= off_th) return false;
      return {};  // inside the hysteresis band: hold previous state

# ---------------------------------------------------------------------------
# Display: 2.8" ILI9341, wired internally on the CYD - no reset pin broken
# out (tied to EN), so it's omitted below.
# ---------------------------------------------------------------------------
spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

# ---------------------------------------------------------------------------
# Touch: same controller/pins as solar_battery_monitor.yaml (confirmed
# working there - see that file's comments for the full rationale). Only
# used here to toggle the backlight on/off on tap - not for any charger
# control or mode switching, so the same generous full-range calibration
# (we only care THAT a touch happened, not where) is enough.
# ---------------------------------------------------------------------------
touchscreen:
  - platform: xpt2046
    id: touch_screen
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    calibration:
      x_min: 0
      x_max: 4095
      y_min: 0
      y_max: 4095
    on_touch:
      - lambda: |-
          // Debounced - a single physical tap can otherwise register as
          // multiple touch events while contact is held/bounces.
          static uint32_t last_toggle = 0;
          uint32_t now = millis();
          if (now - last_toggle < 600) return;
          last_toggle = now;
          id(back_light).toggle().perform();

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

color:
  - id: col_white
    hex: "FFFFFF"
  - id: col_black
    hex: "000000"
  - id: col_green
    hex: "2ECC71"
  - id: col_red
    hex: "E74C3C"
  - id: col_yellow
    hex: "F1C40F"
  - id: col_grey
    hex: "888888"

font:
  - file: "gfonts://Roboto"
    id: font_huge
    size: 56
  - file: "gfonts://Roboto"
    id: font_medium
    size: 24
  - file: "gfonts://Roboto@700"
    id: font_small_bold
    size: 18
  - file: "gfonts://Roboto"
    id: font_tiny
    size: 13

display:
  - platform: ili9xxx
    model: ILI9341
    spi_id: tft_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4
    color_palette: 8BIT
    dimensions:
      width: 320
      height: 240
    transform:
      swap_xy: true
    invert_colors: false
    update_interval: 1s
    lambda: |-
      it.fill(id(col_black));

      // Header
      it.print(10, 6, id(font_small_bold), id(col_grey), "SOLAR BATTERY GUARD");

      // Status line: current date/time + shunt UART baud rate (debug aid)
      auto now = id(ha_time).now();
      char status_buf[40];
      if (now.is_valid()) {
        snprintf(status_buf, sizeof(status_buf), "%04d-%02d-%02d %02d:%02d:%02d  %u baud",
                  now.year, now.month, now.day_of_month,
                  now.hour, now.minute, now.second, id(shunt_uart).get_baud_rate());
      } else {
        snprintf(status_buf, sizeof(status_buf), "----:--:-- --:--:--  %u baud",
                  id(shunt_uart).get_baud_rate());
      }
      it.print(it.get_width() - 10, 6 + 18 + 6, id(font_tiny), id(col_grey),
                TextAlign::TOP_RIGHT, status_buf);

      // Battery SoC (big number, center)
      if (isnan(id(battery_soc).state)) {
        it.print(it.get_width() / 2, 90, id(font_medium), id(col_grey),
                  TextAlign::CENTER, "NO SHUNT DATA");
      } else {
        float soc = id(battery_soc).state;
        Color soc_color = id(col_green);
        if (soc <= id(soc_turn_on_threshold).state) soc_color = id(col_red);
        else if (soc < id(soc_turn_off_threshold).state) soc_color = id(col_yellow);

        char buf[16];
        snprintf(buf, sizeof(buf), "%.0f%%", soc);
        it.print(it.get_width() / 2, 90, id(font_huge), soc_color,
                  TextAlign::CENTER, buf);
      }

      // Voltage (source picked by "Charger Voltage Source", via HA) / current (shunt)
      char vbuf[24];
      bool disp_use_bm2 = id(charger_voltage_source).state == "BM2";
      float disp_voltage = disp_use_bm2 ? id(bm2_battery_voltage).state : id(renogy_battery_voltage).state;
      if (!isnan(disp_voltage)) {
        snprintf(vbuf, sizeof(vbuf), "%.2f V (%s)   %.2f A",
                  disp_voltage, disp_use_bm2 ? "BM2" : "RGY", id(batt_current).state);
      } else {
        snprintf(vbuf, sizeof(vbuf), "-- V   -- A");
      }
      it.print(it.get_width() / 2, 150, id(font_medium), id(col_white),
                TextAlign::CENTER, vbuf);

      // Power / Consumed Ah / Time Remaining
      char pbuf[48];
      if (!isnan(id(batt_power).state)) {
        char time_part[20];
        if (id(capacity) > 0 && id(batt_power).state < 0) {
          float hrs = id(current_stored_energy) / -id(batt_power).state;
          if (hrs >= 24.0f) {
            int days = static_cast<int>(hrs / 24.0f);
            int rem_hours = static_cast<int>(hrs) % 24;
            snprintf(time_part, sizeof(time_part), "%dd %dh left", days, rem_hours);
          } else {
            snprintf(time_part, sizeof(time_part), "%.1fh left", hrs);
          }
        } else {
          snprintf(time_part, sizeof(time_part), "--h left");
        }
        snprintf(pbuf, sizeof(pbuf), "%.0fW  %.1fAh  %s",
                  id(batt_power).state, id(consumed_ah), time_part);
      } else {
        snprintf(pbuf, sizeof(pbuf), "-- W  -- Ah  --h left");
      }
      it.print(it.get_width() / 2, 178, id(font_small_bold), id(col_grey),
                TextAlign::CENTER, pbuf);

      // Charger status banner
      bool charging = id(charger_should_run).state;
      const char* mode = id(charger_override_mode).state.c_str();
      Color bar_color = charging ? id(col_green) : id(col_grey);
      it.filled_rectangle(0, it.get_height() - 40, it.get_width(), 40, bar_color);
      char sbuf[40];
      snprintf(sbuf, sizeof(sbuf), "CHARGER %s  (%s)",
                charging ? "ON" : "OFF", mode);
      it.print(it.get_width() / 2, it.get_height() - 20, id(font_small_bold),
                id(col_black), TextAlign::CENTER, sbuf);
