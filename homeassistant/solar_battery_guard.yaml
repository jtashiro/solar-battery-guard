# Home Assistant automation package for Solar Battery Guard.
#
# Requires `homeassistant:` -> `packages:` to be enabled in configuration.yaml,
# pointing at the folder this file lives in, e.g.:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# then drop (or symlink) this file into that packages folder - or just paste
# its contents into automations.yaml / configuration.yaml directly.
#
# BEFORE USE:
#   1. Plug entity is set to switch.charger_and_fan_socket_2 - note this
#      outlet's name suggests it may also power a fan, not just the AC
#      charger. Double-check nothing else you care about is sharing this
#      socket before enabling these automations, since it'll be switched
#      on/off automatically based on battery SoC.
#   2. Confirm the ESPHome device's entity IDs match what's used here. They
#      default to slugified from "Solar Battery Guard" - check
#      Settings -> Devices & Services -> ESPHome -> Solar Battery Guard.

# Required by pyscript/battery_voltage_chart.py (used by the charger
# ON/OFF email alerts below). Packages merge arbitrary top-level HA config
# keys, so this travels with the repo instead of needing a manual edit to
# configuration.yaml - but the pyscript custom integration itself still
# needs installing (HACS) and the .py file still needs copying to
# /config/pyscript/ by hand, since packages only cover YAML config, not
# custom_components or the pyscript script folder.
pyscript:
  allow_all_imports: true
  hass_is_global: true

input_select:
  solar_battery_guard_backlight_schedule_mode:
    name: "Guard Backlight Schedule Mode"
    icon: mdi:theme-light-dark
    options:
      - "Fixed Times"
      - "Sunset/Sunrise"
    initial: "Fixed Times"

  # Drives which of the "Battery Voltage History" chart's several
  # history-graph cards (one per range, one shown at a time via
  # `conditional`) is visible on the Solar Battery Ops dashboard -
  # history-graph's own hours_to_show isn't entity-driven, so switching
  # ranges from the dashboard needs a helper + one card per range instead
  # of a single templated card.
  solar_battery_guard_voltage_chart_range:
    name: "Voltage Chart Range"
    icon: mdi:clock-outline
    options:
      - "6 Hours"
      - "24 Hours"
      - "3 Days"
      - "7 Days"
    initial: "24 Hours"

input_datetime:
  solar_battery_guard_backlight_off_time:
    name: "Guard Backlight Off Time"
    has_time: true
    has_date: false
    initial: "22:00:00"
  solar_battery_guard_backlight_on_time:
    name: "Guard Backlight On Time"
    has_time: true
    has_date: false
    initial: "07:00:00"

# Battery bank uptime: "depleted" is inferred from BM2 (Bluetooth, its own
# power path) and the shunt (via the Guard ESP32) BOTH going
# unavailable/unknown at the same time - either one alone is a normal,
# expected comms hiccup (WiFi/BLE drop), but both dropping together is a
# much stronger signal the battery bank itself lost power and took the
# load with it, without needing to pick and hand-tune a new critical
# voltage threshold.
template:
  - binary_sensor:
      - name: "Battery Bank Up"
        unique_id: solar_battery_guard_battery_bank_up
        device_class: connectivity
        # NOTE: both these entities are briefly "unknown" right after a
        # Home Assistant restart before their integrations report in, so
        # this can show a false brief "down" blip on every HA restart -
        # not a real depletion event, just a startup-ordering artifact.
        state: >
          {% set shunt_down = states('sensor.solar_battery_guard_battery_voltage') in ['unavailable', 'unknown'] %}
          {% set bm2_down = states('sensor.si_mining_shed_bm2_battery_monitor_9598_voltage') in ['unavailable', 'unknown'] %}
          {{ not (shunt_down and bm2_down) }}

  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: state
        entity_id: binary_sensor.battery_bank_up
    sensor:
      # Human-readable "time since the bank was last down" - server-uptime
      # style, reset by binary_sensor.battery_bank_up's
      # own last_changed rather than a separately tracked counter, so it's
      # correct even across a Home Assistant restart (last_changed survives
      # in the recorder database).
      - name: "Battery Bank Uptime"
        unique_id: solar_battery_guard_battery_bank_uptime
        icon: mdi:timer-outline
        state: >
          {% set start = states.binary_sensor.battery_bank_up.last_changed %}
          {% set diff = (now() - start).total_seconds() | int %}
          {% set months = diff // 2592000 %}
          {% set diff = diff % 2592000 %}
          {% set weeks = diff // 604800 %}
          {% set diff = diff % 604800 %}
          {% set days = diff // 86400 %}
          {% set diff = diff % 86400 %}
          {% set hours = diff // 3600 %}
          {% set diff = diff % 3600 %}
          {% set minutes = diff // 60 %}
          {% set parts = [] %}
          {% if months > 0 %}{% set parts = parts + [months ~ (' month' if months == 1 else ' months')] %}{% endif %}
          {% if weeks > 0 %}{% set parts = parts + [weeks ~ (' week' if weeks == 1 else ' weeks')] %}{% endif %}
          {% if days > 0 %}{% set parts = parts + [days ~ (' day' if days == 1 else ' days')] %}{% endif %}
          {% if hours > 0 and months == 0 %}{% set parts = parts + [hours ~ (' hour' if hours == 1 else ' hours')] %}{% endif %}
          {% if minutes > 0 and months == 0 and weeks == 0 %}{% set parts = parts + [minutes ~ (' min' if minutes == 1 else ' mins')] %}{% endif %}
          {{ (parts[:2] | join(', ')) if parts else 'Just now' }}

# history_stats needs its own top-level `sensor:` list (template: sensors
# above are a different platform) - computes % of the trailing 30 days
# binary_sensor.battery_bank_up spent "on" (up),
# straight from recorder history.
sensor:
  - platform: history_stats
    name: "Battery Bank Uptime 30d"
    unique_id: solar_battery_guard_battery_bank_uptime_30d
    entity_id: binary_sensor.battery_bank_up
    state: "on"
    type: ratio
    end: "{{ now() }}"
    duration:
      days: 30

automation:
  - id: "solar_battery_guard_ac_charger_control"
    alias: "Solar Battery Guard - AC Charger Control"
    description: >
      Mirrors the ESP32's computed charger_should_run decision (SoC
      threshold + hysteresis + manual override, all evaluated on-device) onto
      the actual AC charger smart plug.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.solar_battery_guard_ac_charger_should_run
    condition:
      - condition: state
        entity_id: binary_sensor.solar_battery_guard_ac_charger_should_run
        state:
          - "on"
          - "off"
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.solar_battery_guard_ac_charger_should_run
                state: "on"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.charger_and_fan_socket_2
          - conditions:
              - condition: state
                entity_id: binary_sensor.solar_battery_guard_ac_charger_should_run
                state: "off"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.charger_and_fan_socket_2

  - id: "solar_battery_guard_charger_on_email_alert"
    alias: "Solar Battery Guard - Charger ON Email Alert"
    description: "Emails when the AC charger turns on due to low battery voltage."
    mode: single
    trigger:
      # Triggers off the guard's own decision, not the smart plug - the
      # plug's state change lags an extra automation hop (and the round
      # trip to actually confirm the plug switched), so by the time it
      # fired the voltage template had already drifted from the value
      # that actually caused the decision.
      - platform: state
        entity_id: binary_sensor.solar_battery_guard_ac_charger_should_run
        to: "on"
    action:
      # Renders a local PNG of the shunt's last 6h of voltage before
      # sending the email - see pyscript/battery_voltage_chart.py for the
      # renderer and its one-time setup. This blocks until the file is
      # written, so the notify step below always attaches the current
      # chart, not a stale one from a previous trigger.
      - service: pyscript.render_battery_voltage_chart
        data:
          entity_id: sensor.solar_battery_guard_battery_voltage
          hours: 6
          output_path: /config/www/battery_voltage_chart.png
          voltage_source_entity_id: select.si_mining_shed_solar_battery_guard_charger_voltage_source
      # notify.send_message (the entity-based action used elsewhere in
      # this file) only exposes message/title - no way to attach an
      # image. notify.homeassistant is the underlying legacy service and
      # does support data.images - deliberately NOT setting data.html:
      # true alongside it, since that combination crashes this HA
      # version's smtp integration (_build_html_msg passes the raw
      # html:true boolean into MIMEText instead of the rendered message -
      # looks like an upstream HA bug, not something to work around in
      # our own template). Plain-text message + image attachment avoids
      # that code path entirely, and most mail clients still render an
      # attached image inline anyway.
      - service: notify.homeassistant
        data:
          # "TEST: " prefix distinguishes a manual run (e.g. the automation
          # editor's "Run Actions" button, or automation.trigger called
          # without variables) from a real trigger firing - automation.trigger
          # sets trigger.platform to the literal None (not undefined) in that
          # case, so `not trigger.platform` is what actually catches it.
          title: "{{ 'TEST: ' if not trigger.platform else '' }}Solar Battery Guard - Charger ON"
          message: >
            AC charger turned ON - battery voltage is
            {{ (states('sensor.si_mining_shed_bm2_battery_monitor_9598_voltage') if states('select.si_mining_shed_solar_battery_guard_charger_voltage_source') == 'BM2' else states('sensor.si_mining_shed_solar_battery_guard_renogy_battery_voltage'))|float|round(2) }}V.
          data:
            images:
              - /config/www/battery_voltage_chart.png

  - id: "solar_battery_guard_charger_off_email_alert"
    alias: "Solar Battery Guard - Charger OFF Email Alert"
    description: "Emails when the AC charger turns off after battery voltage recovers."
    mode: single
    trigger:
      # See the ON alert above for why this triggers off the guard's
      # decision rather than the smart plug's state.
      - platform: state
        entity_id: binary_sensor.solar_battery_guard_ac_charger_should_run
        to: "off"
    action:
      # See the ON alert above for why this renders locally and calls
      # notify.homeassistant directly instead of notify.send_message.
      - service: pyscript.render_battery_voltage_chart
        data:
          entity_id: sensor.solar_battery_guard_battery_voltage
          hours: 6
          output_path: /config/www/battery_voltage_chart.png
          voltage_source_entity_id: select.si_mining_shed_solar_battery_guard_charger_voltage_source
      # See the ON alert above for why data.html is deliberately omitted.
      - service: notify.homeassistant
        data:
          # See the ON alert above for why this prefix is conditional.
          title: "{{ 'TEST: ' if not trigger.platform else '' }}Solar Battery Guard - Charger OFF"
          message: >
            AC charger turned OFF - battery voltage is
            {{ (states('sensor.si_mining_shed_bm2_battery_monitor_9598_voltage') if states('select.si_mining_shed_solar_battery_guard_charger_voltage_source') == 'BM2' else states('sensor.si_mining_shed_solar_battery_guard_renogy_battery_voltage'))|float|round(2) }}V.
          data:
            images:
              - /config/www/battery_voltage_chart.png

  - id: "solar_battery_guard_charger_desync_alert"
    alias: "Solar Battery Guard - Charger Plug Desync Alert"
    description: >
      Warns whenever the smart plug's actual state doesn't match what the
      guard commanded, and re-issues the commanded state as a recovery
      attempt. Polls continuously (every 5 minutes) rather than only
      checking once right after a commanded change - a one-shot check only
      catches an offline/unresponsive plug at the moment of a command, but
      misses a desync introduced later by something else touching the plug
      directly (e.g. a manual toggle via a non-HA app), since
      charger_should_run can sit unchanged for a long time while voltage
      stays inside the hysteresis band.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: template
        value_template: >
          {{ (states('binary_sensor.solar_battery_guard_ac_charger_should_run') == 'on') !=
             (states('switch.charger_and_fan_socket_2') == 'on') }}
      # Cooldown - without this, a persistent desync would re-notify (and
      # re-issue the retry below) every 5 minutes for as long as it lasts.
      # Mirrors the cooldown pattern used by
      # solar_battery_guard_auto_calibrate_on_renogy_full below, but
      # anchored on this automation's own last_triggered instead of a
      # helper switch, since this automation doesn't otherwise touch any
      # entity of its own.
      - condition: template
        value_template: >
          {{ state_attr('automation.solar_battery_guard_charger_desync_alert', 'last_triggered') is none or
             (now() - state_attr('automation.solar_battery_guard_charger_desync_alert', 'last_triggered')).total_seconds() >= 3600 }}
    action:
      # Capture state before the retry below changes it, so the email
      # reports what was actually observed rather than the post-retry
      # state.
      - variables:
          guard_should_run: "{{ states('binary_sensor.solar_battery_guard_ac_charger_should_run') }}"
          plug_state_before: "{{ states('switch.charger_and_fan_socket_2') }}"
      # Re-issue the guard's commanded state to the plug. Covers the plug
      # missing the original command (e.g. briefly offline) or being
      # toggled outside HA - either way, re-applying the guard's decision
      # is the correct recovery since the guard is the source of truth for
      # what the plug should be doing. If the plug is still unreachable
      # this silently fails and the alert/retry just fires again in 5
      # minutes.
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ guard_should_run == 'on' }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.charger_and_fan_socket_2
          - conditions:
              - condition: template
                value_template: "{{ guard_should_run == 'off' }}"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.charger_and_fan_socket_2
      - service: notify.send_message
        target:
          entity_id: notify.homeassistant_john_tashiro
        data:
          title: "Solar Battery Guard"
          message: >
            AC charger plug state did not match commanded state (guard says
            {{ guard_should_run }}, plug was {{ plug_state_before }}).
            Automatically resent the "{{ guard_should_run }}" command to
            switch.charger_and_fan_socket_2 - check the plug if this keeps
            recurring, it may be offline or was changed outside Home
            Assistant.

  - id: "solar_battery_guard_critical_low_soc_alert"
    alias: "Solar Battery Guard - Critical Low SoC Alert"
    description: "Notify if SoC keeps falling after the charger was told to turn on - the charger itself may not be working."
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.solar_battery_guard_battery_soc
        below: 15
    action:
      - service: notify.notify
        data:
          title: "Solar Battery Guard - Critical"
          message: >
            Battery SoC is {{ states('sensor.solar_battery_guard_battery_soc') }}%,
            below 15%. Verify the AC charger is actually running.

  - id: "solar_battery_guard_backlight_off_fixed"
    alias: "Solar Battery Guard - Backlight Off (Fixed Time)"
    mode: single
    trigger:
      - platform: time
        at: input_datetime.solar_battery_guard_backlight_off_time
    condition:
      - condition: state
        entity_id: input_select.solar_battery_guard_backlight_schedule_mode
        state: "Fixed Times"
    action:
      - service: light.turn_off
        target:
          entity_id: light.solar_battery_guard_backlight

  - id: "solar_battery_guard_backlight_on_fixed"
    alias: "Solar Battery Guard - Backlight On (Fixed Time)"
    mode: single
    trigger:
      - platform: time
        at: input_datetime.solar_battery_guard_backlight_on_time
    condition:
      - condition: state
        entity_id: input_select.solar_battery_guard_backlight_schedule_mode
        state: "Fixed Times"
    action:
      - service: light.turn_on
        target:
          entity_id: light.solar_battery_guard_backlight

  - id: "solar_battery_guard_backlight_off_sunset"
    alias: "Solar Battery Guard - Backlight Off (Sunset)"
    mode: single
    trigger:
      - platform: sun
        event: sunset
    condition:
      - condition: state
        entity_id: input_select.solar_battery_guard_backlight_schedule_mode
        state: "Sunset/Sunrise"
    action:
      - service: light.turn_off
        target:
          entity_id: light.solar_battery_guard_backlight

  - id: "solar_battery_guard_auto_calibrate_on_renogy_full"
    alias: "Solar Battery Guard - Auto-Calibrate on Renogy Full"
    description: >
      Recalibrates the guard's coulomb-counted SoC to 100% using Renogy's
      independent battery percentage / charging status as the trigger -
      deliberately does NOT check the guard's own SoC first, since the
      scenario this exists to fix is exactly when the guard's SoC has
      already drifted away from 100% while the battery is genuinely full.
      Runs alongside (not instead of) the on-device voltage/tail-current
      heuristic (Battery At Float) - either path can trigger calibration.

      Polls every 5 minutes and checks last_changed directly, rather than
      using a state-change-driven `for:` trigger - a `for:` duration on a
      numeric_state/state trigger never completed in testing against this
      sensor, most likely because it stops emitting state-changed events
      once its value settles near 100% (nothing "transitions" to re-anchor
      the for-timer). This polling approach doesn't depend on that.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      # Cooldown - without this, once the OR block below goes true it
      # would keep re-firing every 5 minutes for as long as the battery
      # sits at 100% (potentially hours), repeatedly re-pulsing the
      # calibration switch. Harmless (recalibrating to already-100% is a
      # no-op) but noisy - skip if it already fired within the last hour.
      - condition: template
        value_template: >
          {{ (now() - states.switch.solar_battery_guard_set_charged_state_calibrate_100.last_changed).total_seconds() >= 3600 }}
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: state
                entity_id: sensor.renogy_controller_renogy_charging_status
                state: "floating"
              - condition: template
                value_template: >
                  {{ (now() - states.sensor.renogy_controller_renogy_charging_status.last_changed).total_seconds() >= 900 }}
          - condition: and
            conditions:
              - condition: numeric_state
                entity_id: sensor.renogy_controller_renogy_battery_percentage
                above: 99
              - condition: template
                value_template: >
                  {{ (now() - states.sensor.renogy_controller_renogy_battery_percentage.last_changed).total_seconds() >= 900 }}
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.solar_battery_guard_set_charged_state_calibrate_100

  - id: "solar_battery_guard_backlight_on_sunrise"
    alias: "Solar Battery Guard - Backlight On (Sunrise)"
    mode: single
    trigger:
      - platform: sun
        event: sunrise
    condition:
      - condition: state
        entity_id: input_select.solar_battery_guard_backlight_schedule_mode
        state: "Sunset/Sunrise"
    action:
      - service: light.turn_on
        target:
          entity_id: light.solar_battery_guard_backlight
